<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithm Vault</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
    width: min(1000px, 92%);
    margin: 55px auto;
}

h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.4rem);
    letter-spacing: -0.04em;
}

.subtitle {
    color: #8b949e;
    margin: 8px 0 28px;
}

.search {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 18px;
    border: 1px solid #30363d;
    border-radius: 10px;
    outline: none;
    background: #161b22;
    color: #e6edf3;
    font-size: 15px;
}

.search:focus {
    border-color: #58a6ff;
}

.status {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 12px;
}

.tree {
    border: 1px solid #30363d;
    border-radius: 14px;
    overflow: hidden;
    background: #0d1117;
}

.node {
    border-bottom: 1px solid #21262d;
}

.node:last-child {
    border-bottom: none;
}

.row {
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    cursor: pointer;
}

.row:hover {
    background: #161b22;
}

.arrow {
    width: 14px;
    color: #8b949e;
    transition: transform .15s ease;
}

.folder.open > .row .arrow {
    transform: rotate(90deg);
}

.icon {
    width: 24px;
    text-align: center;
    flex-shrink: 0;
}

.name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.children {
    display: none;
    margin-left: 25px;
    border-left: 1px solid #30363d;
}

.folder.open > .children {
    display: block;
}

.file a {
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    color: #c9d1d9;
    text-decoration: none;
}

.file a:hover {
    background: #161b22;
    color: #58a6ff;
}

.loading,
.error,
.empty {
    padding: 35px;
    text-align: center;
    color: #8b949e;
}

.github {
    margin-top: 18px;
    color: #6e7681;
    font-size: 13px;
}

.github a {
    color: #58a6ff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>⚡ Algorithm Vault</h1>

    <p class="subtitle">
        Algorithms, implementations and notes — automatically loaded from GitHub.
    </p>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search algorithms or files..."
        autocomplete="off"
    >

    <div id="status" class="status">Loading repository...</div>

    <div id="tree" class="tree">
        <div class="loading">Loading files from GitHub...</div>
    </div>

    <div class="github">
        Source:
        <a
            href="https://github.com/sakib-12345/AlgorithmVault/tree/main/algorithms"
            target="_blank"
            rel="noopener"
        >
            GitHub / algorithms
        </a>
    </div>

</div>

<script>
const API_URL =
    "https://api.github.com/repos/sakib-12345/AlgorithmVault/contents/algorithms?ref=main";

const GITHUB_RAW =
    "https://raw.githubusercontent.com/sakib-12345/AlgorithmVault/main/algorithms/";

const GITHUB_TREE =
    "https://github.com/sakib-12345/AlgorithmVault/blob/main/algorithms/";

const tree = document.getElementById("tree");
const status = document.getElementById("status");
const search = document.getElementById("search");

let allNodes = [];


/*
    GitHub's Contents API gives us the actual folders/files
    inside the repository.

    We recursively call the API for every directory.
*/
async function getDirectory(url) {
    const response = await fetch(url, {
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error(
            "GitHub API error: " +
            response.status +
            " " +
            response.statusText
        );
    }

    return await response.json();
}


async function buildTree(url) {
    const entries = await getDirectory(url);

    const result = [];

    for (const entry of entries) {

        if (entry.type === "dir") {

            const children = await buildTree(
                "https://api.github.com/repos/sakib-12345/AlgorithmVault/contents/" +
                entry.path +
                "?ref=main"
            );

            result.push({
                type: "folder",
                name: entry.name,
                path: entry.path,
                children: children
            });

        } else {

            result.push({
                type: "file",
                name: entry.name,
                path: entry.path,
                html_url: entry.html_url,
                download_url: entry.download_url
            });
        }
    }

    return result;
}


function getFileIcon(filename) {

    const extension =
        filename.includes(".")
            ? filename.split(".").pop().toLowerCase()
            : "";

    const icons = {
        md: "📖",
        py: "🐍",
        java: "☕",
        cpp: "⚙️",
        c: "⚙️",
        js: "🟨",
        html: "🌐",
        css: "🎨",
        json: "📦",
        txt: "📄"
    };

    return icons[extension] || "📄";
}


function createNode(node) {

    const wrapper = document.createElement("div");
    wrapper.className =
        node.type === "folder"
            ? "node folder"
            : "node file";


    const row = document.createElement("div");
    row.className = "row";


    if (node.type === "folder") {

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "▶";

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = "📁";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = node.name;

        row.appendChild(arrow);
        row.appendChild(icon);
        row.appendChild(name);

        const children = document.createElement("div");
        children.className = "children";

        for (const child of node.children) {
            children.appendChild(createNode(child));
        }

        wrapper.appendChild(row);
        wrapper.appendChild(children);

        row.addEventListener("click", function () {
            wrapper.classList.toggle("open");
        });

    } else {

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = getFileIcon(node.name);

        const link = document.createElement("a");

        link.href = node.html_url;
        link.target = "_blank";
        link.rel = "noopener";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = node.name;

        link.appendChild(icon);
        link.appendChild(name);

        row.appendChild(link);
        wrapper.appendChild(row);
    }

    return wrapper;
}


function render(nodes) {

    tree.innerHTML = "";

    if (!nodes.length) {
        tree.innerHTML =
            '<div class="empty">No files found.</div>';

        return;
    }

    for (const node of nodes) {
        tree.appendChild(createNode(node));
    }
}


function flatten(nodes, output = []) {

    for (const node of nodes) {

        output.push(node);

        if (node.type === "folder") {
            flatten(node.children, output);
        }
    }

    return output;
}


function searchTree(nodes, query) {

    if (!query) {
        render(nodes);
        return;
    }

    function filter(node) {

        const selfMatch =
            node.name.toLowerCase().includes(query);

        if (node.type === "file") {
            return selfMatch ? node : null;
        }

        const children = [];

        for (const child of node.children) {
            const match = filter(child);

            if (match) {
                children.push(match);
            }
        }

        if (selfMatch || children.length) {
            return {
                ...node,
                children
            };
        }

        return null;
    }

    const results = [];

    for (const node of nodes) {
        const result = filter(node);

        if (result) {
            results.push(result);
        }
    }

    render(results);

    // Open matching folders.
    document
        .querySelectorAll(".folder")
        .forEach(folder => folder.classList.add("open"));
}


async function init() {

    try {

        const data = await buildTree(API_URL);

        allNodes = data;

        render(allNodes);

        const files = flatten(allNodes)
            .filter(node => node.type === "file")
            .length;

        const folders = flatten(allNodes)
            .filter(node => node.type === "folder")
            .length;

        status.textContent =
            `${folders} folders · ${files} files detected automatically`;

    } catch (error) {

        console.error(error);

        status.textContent = "Failed to load GitHub repository.";

        tree.innerHTML = `
            <div class="error">
                <strong>Could not load your GitHub files.</strong>
                <br><br>
                ${error.message}
                <br><br>
                Make sure the repository is public.
            </div>
        `;
    }
}


search.addEventListener("input", () => {

    const query =
        search.value.trim().toLowerCase();

    searchTree(allNodes, query);
});


init();
</script>

</body>
</html>
